<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🩸 Donor Dashboard</h1>

        <p>Registered Blood Donors</p>


        <!-- Blood Group Dashboard -->

        <div class="dashboard">

            <div class="card">
                <h3>Total Donors</h3>
                <p id="totalDonors">0</p>
            </div>

            <div class="card">
                <h3>A+</h3>
                <p id="aPositive">0</p>
            </div>

            <div class="card">
                <h3>A-</h3>
                <p id="aNegative">0</p>
            </div>

            <div class="card">
                <h3>B+</h3>
                <p id="bPositive">0</p>
            </div>

            <div class="card">
                <h3>B-</h3>
                <p id="bNegative">0</p>
            </div>

            <div class="card">
                <h3>O+</h3>
                <p id="oPositive">0</p>
            </div>

            <div class="card">
                <h3>O-</h3>
                <p id="oNegative">0</p>
            </div>

            <div class="card">
                <h3>AB+</h3>
                <p id="abPositive">0</p>
            </div>

            <div class="card">
                <h3>AB-</h3>
                <p id="abNegative">0</p>
            </div>

        </div>


        <!-- Registered Donors -->

        <h2>Registered Donors</h2>

        <table>

            <thead>

                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Blood Group</th>
                    <th>Location</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="donorTable">

                <!-- Donor details will be displayed here -->

            </tbody>

        </table>


        <br>


        <!-- Back Button -->

        <a href="index.html">← Back to Registration</a>

    </div>


    <!-- JavaScript -->

    <script src="donors.js"></script>

</body>
</html>
