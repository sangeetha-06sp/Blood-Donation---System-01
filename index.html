<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BloodConnect</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header>

    <h1>🩸 BloodConnect</h1>

    <p>
        Intelligent Blood Donation Matching System
    </p>

</header>



<main>


    <!-- =========================
         DONOR REGISTRATION
    ========================== -->

    <section class="card">

        <div class="section-title">

            <span>01</span>

            <div>

                <h2>Donor Registration</h2>

                <p>
                    Register the donor's basic information.
                </p>

            </div>

        </div>



        <div class="form-grid">


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Full Name *
                </label>

                <input
                    type="text"
                    id="donorName"
                    placeholder="Enter full name">

            </div>



            <!-- CONTACT -->

            <div class="form-group">

                <label>
                    Contact Number *
                </label>

                <input
                    type="tel"
                    id="contactNumber"
                    placeholder="Enter mobile number">

            </div>



            <!-- BLOOD GROUP -->

            <div class="form-group">

                <label>
                    Blood Group *
                </label>

                <select id="bloodGroup">

                    <option value="">
                        Select blood group
                    </option>

                    <option>A+</option>
                    <option>A-</option>

                    <option>B+</option>
                    <option>B-</option>

                    <option>AB+</option>
                    <option>AB-</option>

                    <option>O+</option>
                    <option>O-</option>

                </select>

            </div>



            <!-- DOB -->

            <div class="form-group">

                <label>
                    Date of Birth *
                </label>

                <input
                    type="date"
                    id="dob"
                    onchange="calculateAge()">

            </div>



            <!-- AGE -->

            <div class="form-group">

                <label>
                    Current Age
                </label>

                <input
                    type="text"
                    id="age"
                    placeholder="Automatically calculated"
                    readonly>

            </div>



            <!-- GENDER -->

            <div class="form-group">

                <label>
                    Gender *
                </label>

                <select id="gender">

                    <option value="">
                        Select gender
                    </option>

                    <option>Male</option>

                    <option>Female</option>

                    <option>Other</option>

                </select>

            </div>



            <!-- WEIGHT -->

            <div class="form-group">

                <label>
                    Weight (kg) *
                </label>

                <input
                    type="number"
                    id="weight"
                    min="1"
                    placeholder="Enter weight">

            </div>



            <!-- ADDRESS -->

            <div class="form-group full">

                <label>
                    Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter address">
                </textarea>

            </div>



            <!-- LOCATION -->

            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="City / Area">

            </div>



            <!-- DONOR TYPE -->

            <div class="form-group">

                <label>
                    Donor Type
                </label>

                <select id="donorType">

                    <option value="first">
                        First-time Donor
                    </option>

                    <option value="repeat">
                        Repeat Donor
                    </option>

                </select>

            </div>



            <!-- EMERGENCY -->

            <div class="form-group">

                <label>
                    Available for Emergency Requests?
                </label>

                <select id="emergency">

                    <option value="Yes">
                        Yes
                    </option>

                    <option value="No">
                        No
                    </option>

                </select>

            </div>



            <!-- TRAVEL DISTANCE -->

            <div class="form-group">

                <label>
                    Maximum Travel Distance
                </label>

                <select id="distance">

                    <option>5 km</option>

                    <option>10 km</option>

                    <option>25 km</option>

                    <option>50 km</option>

                </select>

            </div>

        </div>



        <!-- CONSENT -->

        <div class="consent">

            <input
                type="checkbox"
                id="consent">

            <label for="consent">

                I understand the blood donation process
                and consent to provide my information
                for donor registration.

            </label>

        </div>



        <button
            onclick="registerDonor()">

            Register Donor →

        </button>



        <div id="registrationMessage"></div>


    </section>



    <!-- =========================
         DONOR PROFILE PREVIEW
    ========================== -->

    <section
        class="card"
        id="profileSection"
        style="display:none;">

        <h2>
            Donor Profile
        </h2>

        <div id="profile"></div>

    </section>


</main>



<footer>

    BloodConnect © 2026

</footer>



<script src="script.js"></script>

</body>

</html>
